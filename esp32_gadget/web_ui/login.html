<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dceeff">
<title>Entrar · ESP32 Gadget</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iI2ZmZmZmZiIgc3Ryb2tlPSIjMDAwIi8+PHBhdGggZD0iTTE2IDQgTDI4IDE2IEwxNiAyOCBMNCAxNiBaIiBmaWxsPSIjMDAwIi8+PC9zdmc+">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-body">

<main class="login" id="contenido">

  <div class="login-brand">
    <span class="logo" aria-hidden="true"><span class="eye"></span><span class="eye"></span></span>
    <h1>ESP BUDDY</h1>
    <p class="sub">Panel de administración</p>
  </div>

  <section class="card login-card">
    <h2>Administrar Buddy</h2>

    <form id="loginForm" class="form" autocomplete="on">
      <label>Usuario
        <!-- Sin type a propósito: el campo viaja así desde el firmware. -->
        <input id="loginUser" name="user" autocomplete="username" maxlength="32" required autofocus>
      </label>
      <label>Contraseña
        <input id="loginPass" name="pass" type="password" autocomplete="current-password" maxlength="64" required>
      </label>
      <div class="actions">
        <button class="btn" type="submit" id="loginBtn">Entrar</button>
      </div>
      <p class="warn" id="loginError" role="alert" hidden></p>
    </form>
  </section>

  <footer>
    <p class="hint"><a class="link" href="/">Volver al inicio</a></p>
  </footer>

</main>

<script src="/login.js"></script>
</body>
</html>
