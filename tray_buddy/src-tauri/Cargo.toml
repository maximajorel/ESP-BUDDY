[package]
name = "tray-buddy"
version = "0.2.0"
description = "Buddy en la bandeja: pantalla, pomodoro y calendario del equipo ESP32"
authors = ["Máximo Majorel"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sin TLS ni features por defecto: el equipo habla HTTP pelado en la LAN y el
# binario no arrastra OpenSSL/schannel. Si algún día el panel sirve HTTPS, esta
# es la línea que cambia.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Instancia única: la mutex y el evento con nombre son de Windows. La versión ya
# estaba en el árbol como dependencia transitiva de Tauri, así que sólo se piden
# las features que hacen falta.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
# El runtime que las pruebas del transporte necesitan para los `async`.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Un solo binario, chico y sin symbolos. `opt-level = "s"` es lo que hace que el
# instalador quede en unos pocos MB: no hay nada acá que necesite velocidad pura.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
