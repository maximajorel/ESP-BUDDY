<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dirección 03 · Colcha de stickers</title>
<style>
  :root {
    --paper: #ffffff; --sky: #dceeff; --gray: #cccccc; --mist: #e9e9e9;
    --ink: #000000; --blue: #4da2ff; --mint: #55db9c; --lav: #e9ccff;
    --ember: #fb4903; --sun: #ffd731; --violet: #5c4ade;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--font); overflow-x: hidden; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .wrap { position: relative; min-height: 100vh; padding: 16px 16px 40px; }
  .ghost {
    position: absolute; left: -6px; top: 6px; margin: 0;
    font-size: 150px; font-weight: 900; line-height: 0.74; letter-spacing: -0.06em; text-transform: uppercase;
    color: transparent; -webkit-text-stroke: 1px var(--ink); opacity: 0.5; pointer-events: none;
  }
  .lead { position: relative; margin: 96px 0 18px; max-width: 22ch; font-size: 15px; font-weight: 500; line-height: 1.4; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--ink); border-radius: 1600px; background: var(--paper); font-size: 10px; font-weight: 700; letter-spacing: 0.032em; text-transform: uppercase; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); border: 1px solid var(--ink); }

  .colcha { position: relative; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .st {
    display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--ink); border-radius: 20px;
    background: var(--paper); font: inherit; color: inherit; text-align: left; cursor: pointer;
    font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
  }
  .st small { display: block; font-size: 10px; font-weight: 500; opacity: 0.7; letter-spacing: 0; }
  .st:nth-child(1) { transform: rotate(-3deg); background: var(--sun); }
  .st:nth-child(2) { transform: rotate(2.5deg) translateY(6px); background: var(--paper); }
  .st:nth-child(3) { transform: rotate(-1.5deg) translateY(-4px); background: var(--lav); }
  .st:nth-child(4) { transform: rotate(1.8deg) translateY(8px); background: var(--paper); }
  .st:nth-child(5) { transform: rotate(-2.2deg); background: var(--mint); }
  .st:nth-child(6) { transform: rotate(3deg) translateY(6px); background: var(--paper); }
  .st:nth-child(7) { transform: rotate(-1deg) translateY(-2px); background: var(--blue); }
  .st[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }

  .big {
    position: relative; margin: 26px 0 0; padding: 18px; border: 1px solid var(--ink); border-radius: 40px;
    background: var(--ember); color: var(--ink); text-align: left; width: 100%; font: inherit; cursor: pointer;
    transform: rotate(-1deg);
  }
  .big h2 { margin: 0; font-size: 46px; font-weight: 900; line-height: 0.82; letter-spacing: -0.05em; }
  .big p { margin: 8px 0 0; font-size: 12px; max-width: 30ch; }
  .big .go { position: absolute; right: 16px; bottom: 14px; width: 40px; height: 40px; border-radius: 1600px; border: 1px solid var(--ink); background: var(--paper); display: grid; place-items: center; font-weight: 900; }

  footer { margin-top: 22px; font-size: 10px; letter-spacing: 0.032em; text-transform: uppercase; }
</style>
</head>
<body>
<main class="wrap">
  <p class="ghost" aria-hidden="true">Sofía</p>
  <p class="lead">Siete pantallas, un botón y ningún login. Elegí la de ahora.</p>
  <span class="pill"><i></i>En línea · Reloj</span>

  <div class="colcha">
    <button class="st" type="button" aria-pressed="true">Reloj<small>La hora del equipo</small></button>
    <button class="st" type="button" aria-pressed="false">Tragamonedas<small>Un toque tira</small></button>
    <button class="st" type="button" aria-pressed="false">Meteoritos<small>Esquivá y sumá</small></button>
    <button class="st" type="button" aria-pressed="false">Red<small>Señal y paquetes</small></button>
    <button class="st" type="button" aria-pressed="false">Música<small>Spotify</small></button>
    <button class="st" type="button" aria-pressed="false">Sofía<small>La cara</small></button>
    <button class="st" type="button" aria-pressed="false">Config<small>Brillo y giro</small></button>
  </div>

  <button class="big" type="button">
    <h2>Ta-te-ti</h2>
    <p>Uno contra uno. En difícil no perdona.</p>
    <span class="go" aria-hidden="true">›</span>
  </button>

  <footer>Este panel vive dentro del equipo.</footer>
</main>
</body>
</html>
